sudo: false
dist: trusty
language: python
cache: pip
python:
  - "3.6"
  - "nightly"
install:
  - pip install --upgrade pycodestyle
  - pip install -r requirements.txt
  - pip install coverage
  - pip install codecov
script:
  - coverage run -m unittest discover
  - codecov

  # Run pycodestyle and ignore errors:
  # E123 closing bracket does not match indentation of opening bracket’s line
  # E124 closing bracket does not match visual indentation
  # E125 continuation line with same indent as next logical line
  # E128 continuation line under-indented for visual indent
  # E129 visually indented line with same indent as next logical line
  # - pycodestyle . --ignore=E123,E124,E125,E128,E129
env:
  global:
    - SECRET_KEY=test
    - R2_ACCOUNT_ID=test
    - R2_ACCESS_KEY_ID=test
    - R2_SECRET_ACCESS_KEY=test
    - R2_BUCKET=crystalprism
    - R2_PUBLIC_BASE=https://pub-test.r2.dev
    - DB_CONNECTION='dbname=crystal_prism user=postgres host=localhost'
    - DB_NAME=crystal_prism
  matrix:
    - ENV_TYPE=Dev
    - ENV_TYPE=Prod
